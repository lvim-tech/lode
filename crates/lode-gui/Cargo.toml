[package]
name = "lode-gui"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "The lode desktop database client — a GUI client of the lode engine"

[[bin]]
name = "lode"
path = "src/main.rs"

[dependencies]
lode-proto = { path = "../lode-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"

# egui/eframe, chosen over GPUI and iced for three reasons, in order:
#
#   1. The result grid is the heart of a database client, and it has to stay
#      smooth on a million rows. egui_extras' TableBuilder virtualises rows out
#      of the box — it renders only what is on screen and asks for those row
#      indices. On GPUI that is a uniform-list implementation to write and tune;
#      here it is a dependency.
#   2. The theming is DATA. egui's Visuals/Style are plain structs a file can
#      fill in, so the 48 lvim-colorscheme styles load as TOML with no code per
#      theme. A toolkit with a stylesheet language would mean generating and
#      parsing one.
#   3. It builds anywhere with a Rust toolchain. GPUI wants a system graphics
#      and font stack present and is a pre-release API; iced sits in between but
#      has neither of the first two advantages.
#
# GPUI remains the sensible target later, when the editor pane wants its own
# text engine and the animations have to be good. It is the wrong first step.
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.32"
egui_extras = "0.32"
