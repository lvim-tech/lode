# The repository is a workspace: the ENGINE is this root package (so its paths,
# its build script and every client that probes `build/loded` stay exactly where
# they were), and the client side lives under crates/ —
#
#   crates/lode-proto   the protocol client: spawn the engine, speak to it
#   crates/lode-ui      the desktop application — GPUI, binary `lode`
#
# The engine does not depend on either. It cannot: its whole point is that a
# client is a separate process, and the moment the engine knew about a client
# there would be a reason for the next client to be different.
[workspace]
members = ["crates/lode-proto", "crates/lode-ui"]

[package]
name = "lode"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "The lode database engine: an async, out-of-process database backend spoken to over newline-delimited JSON-RPC on stdio"
repository = "https://github.com/lvim-tech/lode"

# A binary (the daemon), NOT a library: DB work needs a tokio runtime, pools, TLS
# and cancellation, so a client spawns the engine as a child process and is
# crash-isolated from it — the editor plugin and the GUI alike.
[[bin]]
name = "loded"
path = "src/main.rs"

[dependencies]
# The protocol crate, for the handful of definitions BOTH ends must agree on —
# `looks_like_path` is one rule, not one rule per side. No cycle: lode-proto
# spawns the engine as a process and has no code dependency on it.
lode-proto = { path = "crates/lode-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "time",
    "process",
    "net",
] }
async-trait = "0.1"
futures-util = "0.3"
base64 = "0.22"
anyhow = "1"
# For killing a PROCESS GROUP. A script's timeout has to stop what the script
# STARTED, not only the interpreter: `bash -` running `sleep 30` forks, and
# killing bash leaves sleep holding the output pipes, so the engine waits the
# full thirty seconds for a timeout it set at four hundred milliseconds.
# Already in the dependency tree; this only makes it reachable from here.
libc = "0.2"
# AWS SigV4, for the drivers whose database is an HTTP API. The signing is the
# part that is actually testable offline (AWS publishes canonical vectors), so
# it is written here rather than taken from a crate that would hide it.
sha2 = { version = "0.9", optional = true }
hmac = { version = "0.10", optional = true }

# ── driver crates, each behind a feature so a build can pick its DB set ───────
# tokio-postgres also backs the cockroachdb registry alias (postgres wire).
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }

# ── TLS + SSH tunnel (shared across the network drivers) ──────────────────────
# rustls everywhere (no OpenSSL). The tunnel forwards ANY TCP driver through an
# SSH direct-tcpip channel, so tunnelling needs no per-driver code.
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
bytes = { version = "1", optional = true }
# A CQL primary key is most often a uuid, and a row edit has to BIND one
# (src/drivers/cql.rs) — the scylla crate takes it as a real Uuid, not as text.
uuid = { version = "1", optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
russh = { version = "0.54", optional = true }
# mysql_async backs BOTH the mariadb and mysql registry kinds. rustls (not
# native-tls) so the build needs no OpenSSL.
mysql_async = { version = "0.36", optional = true, default-features = false, features = [
    "default-rustls",
] }
# The official MongoDB driver (tokio + rustls by default; no OpenSSL).
mongodb = { version = "3", optional = true }
# Embedded SQL engines (synchronous C libraries, driven on spawn_blocking).
# rusqlite is NOT optional: besides the sqlite DRIVER it backs the engine's own
# saved state (src/store.rs — connections, saved queries, history), which every
# build has, so a --no-default-features engine still carries it.
# `column_decltype` is what lets the SQLite driver report a column's DECLARED
# type, which the engine then derives a `kind` from. Without it every column of
# every SQLite query reads as `unknown` and a client is back to guessing from
# the page. It is a feature of a dependency already here, not a new one.
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
duckdb = { version = "1", optional = true, features = ["bundled"] }
# Redis (tokio async multiplexed connection).
redis = { version = "0.27", optional = true, features = [
    "tokio-comp",
    "connection-manager",
] }
# ClickHouse + Snowflake speak HTTP; reqwest with rustls (no OpenSSL) is the seam
# (the client needs DYNAMIC result columns, which the typed `clickhouse` crate is
# not built for — the HTTP JSONCompact interface gives them directly).
# Shared by every driver whose database is an HTTP API: clickhouse, s3,
# dynamodb, cloudwatch, influxdb and the remote half of libsql.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls",
    "json",
] }
# SQL Server (TDS). tiberius is runtime-agnostic; tokio-util's compat adapts a
# tokio TcpStream to its futures-io. rustls, no OpenSSL.
tiberius = { version = "0.12", optional = true, default-features = false, features = [
    "rustls",
    "tds73",
    "chrono",
] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
# Cassandra / ScyllaDB (CQL). Production driver, Cassandra-compatible.
scylla = { version = "1", optional = true }
# Firebird — PURE-RUST wire protocol (no libfbclient at runtime) so it stays in
# the standard build; the native-client mode is the opt-in `firebird-native`.
rsfbclient = { version = "0.25", optional = true, default-features = false, features = [
    "pure_rust",
] }
# Snowflake key-pair JWT (RS256) generation for its HTTP SQL REST API.
snowflake-jwt = { version = "0.3", optional = true }
# chrono: used by the SQL Server driver to render TDS date/time cells as text.
chrono = { version = "0.4", optional = true }

[features]
# The full standard driver set is enabled by default as each driver module
# lands. Opt-in drivers that need a system library at runtime (Oracle Instant
# Client, the Firebird native client) stay OUT of default (see below).
default = [
    "tls",
    "tunnel",
    "postgres",
    "cockroachdb",
    "redshift",
    "s3",
    "dynamodb",
    "cloudwatch",
    "influxdb",
    "libsql",
    "mariadb",
    "mysql",
    "mongodb",
    "sqlite",
    "duckdb",
    "redis",
    "clickhouse",
    "sqlserver",
    "snowflake",
    "cassandra",
    "scylla",
    "firebird",
]
# Shared encryption seam: rustls TLS for the network drivers + the russh SSH
# tunnel (an encrypted channel for any TCP driver, native-TLS or not).
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:rustls-native-certs", "dep:tokio-rustls"]
tunnel = ["dep:russh", "tls"]
# `bytes` is the BytesMut in ToSql's signature: this driver binds a row edit's
# values itself, in text form, and lets the server parse them (src/drivers/postgres.rs).
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:bytes", "tls"]
cockroachdb = ["postgres"] # registry alias over the postgres wire driver
# The drivers whose database is an HTTP API. `aws` is the signing they share.
aws = ["dep:sha2", "dep:hmac", "dep:reqwest", "tls"]
s3 = ["aws"]
dynamodb = ["aws"]
cloudwatch = ["aws"]
# InfluxDB is a token, not a signature: no AWS signing in it.
influxdb = ["dep:reqwest", "tls"]
# A LOCAL libSQL file is a SQLite file, so that half is the sqlite driver.
libsql = ["dep:reqwest", "tls", "sqlite"]
redshift = ["postgres"]    # the same: Redshift speaks the PostgreSQL wire
mariadb = ["dep:mysql_async", "tls"]
mysql = ["dep:mysql_async", "tls"] # same impl as mariadb, distinct registry kind
mongodb = ["dep:mongodb", "tls"]
sqlite = [] # rusqlite is unconditional (the store needs it); this gates only the DRIVER
duckdb = ["dep:duckdb", "dep:chrono"] # chrono renders DuckDB temporal cells as canonical text
# No TLS feature of redis-rs: this driver does its own handshake with the
# engine's shared rustls config (src/tls.rs), so the CA, the client identity and
# the meaning of each mode are decided in ONE place for every driver.
redis = ["dep:redis", "tls"]
clickhouse = ["dep:reqwest", "tls"]
sqlserver = ["dep:tiberius", "dep:tokio-util", "dep:chrono"]
cassandra = ["dep:scylla", "dep:uuid"] # CQL; one impl serves cassandra + scylla kinds
scylla = ["dep:scylla", "dep:uuid"]
firebird = ["dep:rsfbclient"] # pure-Rust wire protocol (self-contained)
firebird-native = ["firebird", "rsfbclient/linking"] # opt-in: uses libfbclient at runtime
snowflake = ["dep:reqwest", "dep:snowflake-jwt"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
